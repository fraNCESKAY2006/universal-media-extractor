version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ume_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: ume_api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/tmp/ume_storage
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - shared_storage:/tmp/ume_storage
    depends_on:
      - redis

  worker:
    build: .
    container_name: ume_worker
    command: celery -A backend.worker.celery_app worker --loglevel=info --concurrency=2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/tmp/ume_storage
    volumes:
      - ./backend:/app/backend
      - shared_storage:/tmp/ume_storage
    depends_on:
      - redis

volumes:
  redis_data:
  shared_storage: